aid: overlay
name: Overlay
description: >-
  Overlay is a decentralized perpetual-futures protocol on BNB Smart Chain (chain
  id 56) that lets anyone trade and permissionlessly create markets for emerging,
  pre-CEX, and narrative-driven assets against any verifiable data feed. Positions
  are synthetic — traders trade against a protocol-managed price feed with
  USDT/stablecoin collateral rather than an order book — with a dynamic risk
  engine managing thin markets and zero liquidity requirements. Overlay exposes a
  public, unauthenticated market-data API (aggregator contracts, contract specs,
  market catalog, charts price overview), a TypeScript SDK, a GraphQL subgraph,
  and a provider-published Agent Skill for automated trading. Backed by Polychain.
